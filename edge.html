    <!--
      DIRECTION CONTRACT · seed 259b55ff · scope direction · mode operate

      THESIS: A rollout is read off a rack of instruments, not a page of cards. It refuses the
      category default this panel would otherwise be — rounded cards, sparklines, and a red or
      green dot per region — because the operator it is built for cannot separate red from green
      and because a dot says nothing a legend could not say better.

      OWN-WORLD: A 19-inch anodised rack panel. Graphite faces cut into a darker bay, every edge
      an engraved hairline (light above, dark below), zero corner radius anywhere. Bone silkscreen
      legends in tracked small caps; every identifier and figure in tabular mono, as a counter
      readout. One incandescent amber signal lamp and one cool blue-white for the operator's own
      mark. State is a filled, hollow, hatched or struck form first and a colour second.

      STORY: An agent has proposed a config release across thirty-six points of presence at once.
      The operator sees the whole estate as one instrument, opens the drawer the proposal arrives
      in, unlatches the sites they will not take tonight, and commits the rest. The rules that
      closed a site come back named.

      FIRST VIEWPORT: A head panel with the estate's readouts across the top right, an autonomy
      bar beneath it, then the rack itself filling the screen — six engraved region bands, one
      dense row per site, traffic drawn against a graticule. The primary action does not exist
      until an agent proposes something; when it does, the bench drawer rises from the bottom
      edge and the rack recedes behind it.

      FORM: The instrument rack front panel; candidate 5 of 7 on the grounded list (1 railway
      interlocking mimic panel, 2 lockout-tagout tag board, 3 annunciator legend panel,
      4 substation one-line mimic, 5 rack instrument front panel, 6 broadcast console channel
      strips, 7 ATC flight-progress strip board). Seed key 259b55ff assigned index 5.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="edge-root"></div>
    <script type="module" src="/src/edge/main.tsx"></script>
  </body>
